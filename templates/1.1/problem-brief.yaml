  requested_solution_or_feature: "An assistant that answers travel-policy questions."
  bounded_desired_work_outcome: "Provide an understandable policy answer grounded in a current, approved, requester-permitted source, or make the evidence gap clear."
  problem_not_solution_note: "The request is a starting point for discovery; it is not a decision to use an agent or a specific implementation."

