  user_groups:
    - id: "employee-policy-requester"
      task: "Find and understand the current internal policy relevant to a travel question."
      relevant_context: "May need to act on the answer while preparing a travel claim."
    - id: "contractor-policy-requester"
      task: "Seek help about a travel-policy question."
      relevant_context: "May not be permitted to read the policy documents used in this illustration."
  other_stakeholders:
