      status: "not yet performed in this illustrative record"
    - type: "available request, handoff, or source-status records"
      status: "not yet reviewed in this illustrative record"

problem_analysis:
  symptoms:
    - "The requester may encounter multiple policy documents while seeking a current answer."
    - "The requester may require help when the answer remains unclear."
  contributing_cause_hypotheses:
    - hypothesis: "Current versus superseded source status may be unclear at the point of search."
      status: "unverified"
    - hypothesis: "A permitted current source may be missing or conflicting for a given request."
      status: "unverified outside the fictional fixture variants"
  process_or_non_agent_options_to_consider:
    - "Clarify source ownership and current-status publication."
    - "Improve the intake information or handoff for unresolved questions."
    - "Provide a permission-aware way to locate the current approved source."

in_scope_task_classes:
  - id: "current-policy-question"
    user_group: "employee-policy-requester"
    representative_input: "What is the hotel limit for a work trip to London?"
    needed_result: "A clear answer supported by a current approved source available to the requester, or useful uncertainty and a next source of help."
    material_variations:
      - type: "missing_information"
        situation: "The answer-bearing current permitted source is unavailable."
        needed_result: "Do not present a definitive amount; identify the information gap or request clarification."
      - type: "conflicting_information"
        situation: "Two equally authoritative current permitted sources conflict."
        needed_result: "Identify the conflict and do not select a definitive amount automatically."
      - type: "permission_boundary"
        situation: "The requester is not permitted to read the named policy sources."
        needed_result: "Do not disclose restricted policy content."

