    observed_result: null

  - metric_id: total_cost_per_verified_contract_appropriate_outcome
    dimension: economics
    metric_role: decision_metric_candidate
    claim: Accounted total cost per verified contract-appropriate outcome for the declared population.
    unit: eligible_request_episode
    population: All eligible request episodes started in the named candidate or measurement window.
    formula:
      type: ratio
      numerator: >-
        Accounted cost of all eligible episodes, including applicable model or service use,
        supporting operations, retries, infrastructure, and material human review or correction.
      denominator: Verified contract-appropriate outcomes under the declared method.
      aggregation: null
