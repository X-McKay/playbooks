    status: unresolved
  release_or_risk_acceptance_authority:
    name_or_staffed_group: not-yet-named
    status: not-self-assumed
  containment_authority:
    name_or_staffed_group: not-yet-named
    status: not-yet-confirmed
  restart_decision_authority:
    name_or_staffed_group: not-yet-named
    status: not-yet-confirmed
  combined_roles:
    status: none-recorded-yet
    independent-review-question: record any policy-required independent review if roles are combined

potential_pilot_boundary:
  authorization_status: not-authorized-illustrative-boundary-only
  eligible_users_and_tasks:
    - employee-uk-104 fixture context only, for read-only internal policy questions
  task_data_and_capability_limits:
    - requester-permitted current approved policy evidence in the controlled fictional fixture
    - no record changes, payment, spending, reimbursement, approval, or external action
    - no use of unapproved, untrusted, or requester-restricted material as authority
  excluded_users_tasks_or_actions:
    - contractor-uk-204 fixture context for named restricted policy documents
    - unresolved equally authoritative current policy conflict as a definitive-answer task
    - any use outside the declared fictional fixture
  future_entry_evidence_needed:
    - evidence design and interpretation under Part 4
    - applicable boundary and data-control evidence under Part 3
    - named reachable support and containment coverage
    - disposition of relevant specialist-review questions
  future_expansion_evidence_needed:
    - task-specific evidence for the proposed wider boundary
    - reassessment of new users, sources, permissions, capabilities, authority, and dependencies
    - applicable readiness and rollout decision under Part 5
  support_and_reporting_path: not-yet-named
  stop_conditions:
    - suspected disclosure or failed requester-permission enforcement
    - reliance on superseded or conflicting policy evidence without a bounded response
    - prohibited use or externally visible effect
    - unavailable response, containment, or escalation coverage
    - failed applicable hard gate or missing required evidence
  containment_method_and_owner: not-yet-determined
  user_or_operator_notification_question: not-yet-determined
  restart_authorization: not-yet-named

applicability_and_handoffs:
  record_state_options:
    - applicable
    - not_applicable_with_rationale
    - unresolved
  reference_parts:
    - part: Part 3
      state: unresolved
      reason: source, requester-permission, untrusted-content, and data-handling questions need applicable boundary controls
    - part: Part 4
      state: applicable
      reason: future claims, cases, evaluator design, evidence, and interpretation are not supplied by this planning record
    - part: Part 5
      state: unresolved
      reason: applies to any later readiness, release, rollout, support, and lifecycle decision
    - part: Part 7
      state: unresolved
      reason: determine from actual long-running, resumable, side-effecting, approval-waiting, or consequential execution conditions
    - part: Part 10
      state: unresolved
      reason: use the detailed method if the screen identifies its stated triggers or another applicable floor
  unresolved_questions_and_review_owner:
    - question: What handling, retention, diagnostic, and access controls are applicable to actual source material?
      review_owner: not-yet-named
    - question: Which authority, execution, approval, and recovery conditions apply if the boundary changes?
      review_owner: not-yet-named
    - question: Which specialist, legal, contractual, privacy, security, or domain reviews apply in the actual context?
      review_owner: not-yet-named

reassessment_triggers:
  - intended or prohibited use changes
  - affected users, non-users, downstream reliance, or delivery boundary changes
  - source, source status, permission, sensitivity, or handling changes
  - new connection, model, tool, capability, authority, or externally visible effect is proposed
  - dependency, support, containment, or restart coverage changes
  - new evidence, hard-gate failure, incident, near miss, complaint, or applicable-policy change emerges

observations_and_decisions:
  observed_results: null
  control_evidence: null
  risk_acceptance: null
  pilot_or_release_decision: null
  note: >-
    All fixture facts and planned outcomes in this record are illustrative. They are not evidence that a
    candidate was run, a control operated, a pilot was authorized, or a decision was made.
