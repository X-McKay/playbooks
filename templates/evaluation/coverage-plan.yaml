recording_rules:
  source_and_permission: Record source identity, quoted revision, status, admission, and requester decision separately from prose support.
  semantic_review: Qualified human review is required for the release-facing semantic-support claim in this example.
  model_judge: grounding-judge@v1 is diagnostic-only until documented gate fitness exists.
  evidence_statuses:
  - pass
  - fail
  - invalid
  - inconclusive
  invalidity_note: Invalid or inconclusive evidence is visible and never counted as pass; an observable candidate failure is not relabelled invalid.
  decision_thresholds: To be supplied by the accountable owner; this illustrative template supplies no universal threshold, pass rate, or trial count.
