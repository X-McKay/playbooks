  candidate: policy-assistant@candidate-current-selection
  baseline: policy-assistant@baseline-current-selection
  development_fixture: travel-policy-current@fixture-2026-10-18.1
  release_holdout: policy-release-holdout@v1
  current_source: travel-policy-2026@2026-10-01
  superseded_source: travel-policy-2024-superseded@2024-01-01
