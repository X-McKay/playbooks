companion_files:
  case_fixture: case-fixture.yaml
  evaluators: evaluator-record.yaml
  trials: trial-policy.yaml
  decision: decision-report.yaml
subject:
  candidate: policy-assistant@candidate-current-selection
  baseline: policy-assistant@baseline-current-selection
  contract: Approved, current, permission-filtered policy answers with citations; ephemeral and read-only.
  terminal_outcomes:
  - complete
  - needs_information
  - declined
  - failed
  - contract-defined partial or escalation only
  enabled_capabilities:
  - approved policy retrieval
  - citation output
  absent_capabilities:
  - external write
  - persisted memory
  - approval workflow
  - delegated agent
  - live operation
  resolved_configuration_placeholder: Record the actual resolved model, instructions/settings and retrieval-interface revisions before real evidence is used; candidate identity alone is not sufficient.
  harm_screen_placeholder: Accountable owner records harm/domain screening before actual exposure. This fictional read-only example makes no eligibility/allocation or elevated-assurance conclusion; any changed use must be reassessed.
profiles:
  selected:
  - id: universal-core
    rationale: Every release-facing claim needs traceable case, fixture, evaluator, and decision evidence.
  - id: approved-retrieval
    rationale: Approved source identity, currentness, and permission determine policy answers.
  - id: untrusted-content
    rationale: A document channel can reach the assistant context.
  - id: sensitive-tenant
    rationale: Permission-filtered policy access is part of the scenario.
  - id: semantic-variation
    rationale: The assistant accepts natural-language requests and makes permission/currentness/evidence decisions.
  - id: tools-and-trajectory
    rationale: An admitted policy-retrieval interface, its arguments and trusted permission/stop decisions can affect the outcome.
  - id: model-selection
    rationale: The candidate model/instructions/settings affect semantic behavior; actual resolved configuration is recorded before real evaluation.
  - id: context-transform
    rationale: Permission filtering and selection of retrieved source context affect the answer; stored memory remains absent.
  - id: diagnostic-model-evaluator
    rationale: The optional grounding judge is used only for diagnosis and needs purpose-fit self-tests; it has no gate-fitness claim and does not replace qualified human review.
  scoped_not_applicable:
  - profile: external-effect
    rationale: The evaluated assistant has no admitted write or other external state-changing capability.
  - profile: human-approval
    rationale: The evaluated assistant has no approval-required action.
  - profile: durable-work
    rationale: The evaluated assistant is ephemeral and non-resumable.
  - profile: stored-memory
    rationale: The evaluated assistant has no persisted memory or stateful context claim.
  - profile: composition
    rationale: The evaluated assistant has no delegated or remote model-driven collaborator.
  - profile: shared-capacity
    rationale: This controlled single-session example makes no shared queue, concurrency or contention guarantee; per-run bounds still apply.
