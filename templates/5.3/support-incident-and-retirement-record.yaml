      note: >-
        Runtime stop mechanics and the treatment of in-flight operations belong
        to Chapter 5.1; a stop would not itself establish recovery approval.
    restart_after_containment:
      identity: unresolved-placeholder
      authority_status: not-granted
      required_record: >-
        Cause or remaining uncertainty, corrective action, applicable safeguard
        and release-gate evidence, and explicit authorization to resume.
    material_change:
      identity: unresolved-placeholder
