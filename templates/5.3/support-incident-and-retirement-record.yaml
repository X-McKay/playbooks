# Illustrative planning record only. It records no real deployment, evaluation,
# incident, authorization, recovery, or retirement and contains no secrets.
example_id: POLICY-BUILD-001
use_case_id: internal-policy-assistance
status: illustrative-unexecuted
packet_id: POLICY-OPS-001
record_purpose: >-
  Show the information a lifecycle support record can make inspectable for a
  fictional permission-filtered, read-only internal policy assistant.
illustrative_boundary:
  actual_deployment: none
  actual_production_run: none
  actual_evaluation: none
  actual_incident: none
  actual_authorization: none
  actual_recovery: none
  actual_retirement: none
  control_effectiveness_evidence: absent
  note: >-
    Filled fields are planning values or controlled-fixture facts, not evidence
    that a support process, control, or response operated.

capability_context:
  candidate: policy-assistant@candidate-current-selection
  service_description: >-
    Fictional internal assistant that answers approved travel-policy questions
    from permission-filtered sources and has no external write capability.
  enabled_effects: []
  proposed_inventory_state: planned-not-active

