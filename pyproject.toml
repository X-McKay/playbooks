[project]
name = "agent-playbook-workspace"
version = "0.1.0"
description = "Reproducible workspace for the Playbooks repository"
requires-python = ">=3.12,<3.15"
dependencies = ["agentctl-playbook"]

[dependency-groups]
dev = [
    "hatchling==1.33.0",
    "markdown-it-py==4.2.0",
    "ruff==0.16.9",
]
examples = [
    "pydantic-ai-slim==2.70.0",
]

[tool.uv]
default-groups = ["dev", "examples"]
package = false

[tool.uv.sources]
agentctl-playbook = { workspace = true }

[tool.uv.workspace]
members = ["tools/agentctl"]

[tool.ruff]
line-length = 88
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM", "TRY"]
ignore = ["E501", "TRY003"]
